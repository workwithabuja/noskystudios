          <h1>Anatomy Privacy Policy</h1>
          <p>Anatomy is a music analysis app published by NoSky Studios Ltd (RC 7631695), Nigeria. All musical analysis happens on your device, and your recordings and imported songs are never uploaded. Anatomy has no accounts, no analytics, and no tracking. To name a song, Apple's Shazam receives an acoustic signature, not playable audio; Apple's iTunes Search receives a named song's title and artist, or its Apple Music ID, to look up details such as its genre and album. Purchases are handled by Apple. This page requires JavaScript to display in full; for the full policy, enable JavaScript or contact <a href="mailto:privacy@noskystudios.ng">privacy@noskystudios.ng</a>.</p>
